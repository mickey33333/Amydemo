name: Wuxi company screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - run-id.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and Chinese fonts
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Capture Wuxi companies
        id: capture
        continue-on-error: true
        env:
          PW_TEST_SCREENSHOT_NO_FONTS_READY: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/scrape_wuxi_v2.py")
          text = path.read_text(encoding="utf-8")
          needle = '            click_region_option(page, "江苏省")'
          insertion = (
              '            click_region_option(page, "中国")\n'
              '            page.wait_for_timeout(1500)\n'
              + needle
          )
          if 'click_region_option(page, "中国")' not in text:
              if needle not in text:
                  raise SystemExit("Could not find Jiangsu selection line")
              text = text.replace(needle, insertion, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python scripts/scrape_wuxi_v2.py

      - name: Upload result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuxi-company-screenshots
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Record workflow run ID
        if: always()
        run: |
          echo "$GITHUB_RUN_ID" > run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-id.txt
          git diff --cached --quiet || git commit -m "Record screenshot workflow run $GITHUB_RUN_ID"
          git push origin HEAD:main

      - name: Report capture failure
        if: steps.capture.outcome != 'success'
        run: |
          echo "Crawler returned a non-zero exit code. Download the artifact for diagnostics."
          exit 1
